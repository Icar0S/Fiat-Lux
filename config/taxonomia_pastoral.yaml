# Taxonomia pastoral (plano Apêndice B). Referências no esquema `eng` (convertidas para a
# tradução do perfil). `palavras_chave` alimentam o classificador de reserva (sem LLM) e as
# consultas determinísticas; comparação sem acentos.
versificacao: eng
categorias:
  luto_tragedia:
    nome: Luto e tragédias   # exibido ao leitor
    descricao: Mortes, desastres, acidentes com vítimas
    temas: [consolo, esperança na ressurreição, solidariedade]
    sementes: [MAT.5.4, PSA.34.18, JHN.11.25-26, REV.21.4, 2CO.1.3-4]
    sementes_deutero: [WIS.3.1-3]
    palavras_chave: [morte, mortos, morre, morreu, vítimas, tragédia, luto, velório, desabamento, acidente, queda de avião, naufrágio, deslizamento, soterrad]
    gravidade_base: 2
  violencia:
    nome: Violência e insegurança   # exibido ao leitor
    descricao: Crimes violentos, ataques, insegurança
    temas: [vencer o mal com o bem, justiça, paz interior]
    sementes: [ROM.12.21, MAT.5.38-48, PSA.37.1-11, ISA.60.18]
    palavras_chave: [assassin, homicídio, chacina, tiroteio, baleado, facção, assalto, violência, crime, esfaque, feminicídio, latrocínio, sequestro, polícia prende]
    gravidade_base: 2
  guerra_conflito:
    nome: Guerras e conflitos   # exibido ao leitor
    descricao: Guerras, conflitos armados, tensões entre nações
    temas: [paz, reconciliação, desarmamento do coração]
    sementes: [MAT.5.9, ISA.2.4, PSA.46.9, EPH.2.14, JAS.4.1-2]
    palavras_chave: [guerra, bombardeio, míssil, ataque aéreo, tropas, invasão, cessar-fogo, conflito armado, exército, drone, ofensiva, gaza, ucrânia, israel, rússia, hamas, war, ceasefire]
    gravidade_base: 2
  injustica_pobreza:
    nome: Injustiça e pobreza   # exibido ao leitor
    descricao: Fome, desigualdade, exploração, direitos violados
    temas: [justiça, cuidado dos pobres, dignidade]
    sementes: [AMO.5.24, MIC.6.8, ISA.58.6-10, LUK.4.18-19, JAS.2.14-17, MAT.25.31-46, PRO.31.8-9]

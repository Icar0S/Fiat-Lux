  poder_bem_comum:
    nome: Vida pública e bem comum   # exibido ao leitor
    descricao: Política, corrupção, instituições (sempre tratado por princípios)
    temas: [serviço, honestidade, bem comum, oração pelas autoridades]
    sementes: [MRK.10.42-45, PRO.29.2, 1TI.2.1-2, EXO.23.8, MIC.6.8]
    sementes_deutero: [WIS.6.1-11]
    palavras_chave: [governo, congresso, senado, câmara, stf, ministro, eleição, eleições, candidato, partido, corrupção, propina, impeachment, presidente, governador, prefeito, deputado, votação, lei, reforma]
    gravidade_base: 1
  saude_doenca:
    nome: Saúde e doença   # exibido ao leitor

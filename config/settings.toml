# Parâmetros gerais do Fiat Lux (plano §5 e Apêndice E).
# Variáveis de ambiente prevalecem: FIATLUX_PERFIL, FIATLUX_TZ, FIATLUX_ESTADO,
# FIATLUX_CUSTO_MAX_MENSAL_USD e os segredos (ANTHROPIC_API_KEY, TELEGRAM_*).

[geral]
nome = "Fiat Lux"
versao_pipeline = "0.1.0"
fuso = "America/Fortaleza"
perfil_padrao = "catolico"
regiao = "Ceará"

[caminhos]
dados = "data"
raw = "data/raw"
interim = "data/interim"
biblia_db = "data/processed/biblia.sqlite"
estado_db = "data/estado/estado.sqlite"
markdown = "data/markdown"
cache = "data/cache"
saidas = "saidas"
relatorio_corpus = "docs/qualidade-corpus.md"

[liturgia]
url_base = "https://liturgia.up.railway.app/v2/"
timeout_s = 10
tentativas = 3
dias_prefetch = 7
memoria_facultativa_usa_feria = true

[llm]
provedor = "anthropic"            # anthropic | offline (determinístico, sem rede)
modelo_classificacao = "claude-haiku-5-5"
modelo_geracao = "claude-sonnet-5-5"
modelo_juiz = "claude-sonnet-5-5"
# A API 2026-10-21 (SDK anthropic 2.x) não aceita mais `temperature`; Haiku 5.5 e Sonnet 5.5 só
# amostram com o padrão. As temperaturas do plano (0 / 0,2 / 0,6) viraram níveis de esforço
# (`output_config.effort`); a reprodutibilidade vem do cache por hash de entrada (ADR-008).
esforco_classificacao = "low"
esforco_consultas = "low"
esforco_selecao = "medium"
esforco_redacao = "medium"
esforco_juiz = "low"
max_tentativas_redacao = 2
max_tokens = 16000
timeout_s = 120
cache = true

[rag]
embedder = "auto"                 # auto | neural | lexical
modelo_embeddings = "intfloat/multilingual-e5-base"
modelo_rerank = "BAAI/bge-reranker-v2-m3"
usar_rerank = true
top_denso = 50
top_esparso = 50
top_rerank = 40
max_consultas_rerank = 4          # cross-encoder só nas 4 primeiras (Evangelho + LLM); ~0,45 s/par em CPU
candidatos_llm = 12
rrf_k = 60
mmr_lambda = 0.7
min_votos_xref = 5
pesos = { rerank = 0.55, ancora = 0.15, tempo = 0.10, grafo = 0.10, cobertura = 0.10 }
repeticao = { principal_dias = 60, complementar_dias = 30 }
recorte = { min_vers = 1, max_vers = 5, penalidade_comprimento = 0.08 }

[medidor]
pesos_escopo = { mundial = 0.35, nacional = 0.30, regional = 0.35 }
formula = { base = 50, k_tom = 10, k_volume = 5, k_gravidade = 10 }
faixas = { calmo = 29, atencao = 54, tensao = 74 }   # acima de 74 = crise
janela_baseline_dias = 30
clusters_top = 5
evento_dominante_razao = 3.0

[noticias]
intervalo_gdelt_s = 5.5
max_registros = 250
timespan = "24h"
limiar_cluster = 0.80             # distância de cosseno no TF-IDF das manchetes do dia (ADR-011)
limiar_dedup_titulo = 90
limiar_dedup_cosseno = 0.92
top_clusters_classificar = 15
titulos_por_cluster = 5
confianca_minima = 0.5

[entrega]
telegram = true
arquivo = true
email = false
horario_limite = "06:30"
limite_telegram = 4096

[custos]
custo_max_mensal_usd = 10.0
# US$ por milhão de tokens; conferir a tabela oficial antes de mudar de modelo.
precos = { "claude-haiku-5-5" = { entrada = 0.10, saida = 0.50 }, "claude-sonnet-5-5" = { entrada = 2.00, saida = 10.00 }, "claude-opus-5-5" = { entrada = 4.00, saida = 20.00 } }

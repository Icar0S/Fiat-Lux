name: construir-indice
on:
  workflow_dispatch:
    inputs:
      embedder:
        description: "neural | lexical"
        default: neural
permissions:
  contents: write
jobs:
  indice:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      HF_HOME: .cache/huggingface
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: hf-${{ hashFiles('config/settings.toml') }}
      - run: uv sync --frozen --extra ml
      - run: |
          uv run fiatlux biblia baixar
          uv run fiatlux biblia ingerir
          uv run fiatlux biblia validar
          uv run fiatlux indice construir --embedder ${{ inputs.embedder }}
      - name: Publicar como Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete indice-latest --yes || true
          gh release create indice-latest data/processed/biblia.sqlite data/processed/lexical.pkl \
            --title "Índice bíblico ($(date -u +%F))" --notes "Gerado por construir-indice.yml" || \
          gh release create indice-latest data/processed/biblia.sqlite \
            --title "Índice bíblico ($(date -u +%F))" --notes "Gerado por construir-indice.yml"

name: palavra-semanal
on:
  schedule:
    - cron: "0 20 * * 6"      # sábado 17:00 America/Fortaleza
  workflow_dispatch:
    inputs:
      semana:
        description: "AAAA-Wnn (opcional)"
        required: false
concurrency: fiat-lux
permissions:
  contents: write
jobs:
  semanal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      HF_HOME: .cache/huggingface
      FIATLUX_ESTADO: estado/estado.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: estado
          path: estado
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: hf-${{ hashFiles('config/settings.toml') }}
      - run: uv sync --frozen --extra ml
      - run: uv run fiatlux indice baixar-release
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Palavra da Semana
        run: uv run fiatlux --json-logs palavra semanal ${{ inputs.semana && format('--semana {0}', inputs.semana) || '' }}
        env:
          # servidor de LLM: URL e chave nos secrets; modelos (opcionais) nas variables
          FIATLUX_LLM_URL: ${{ secrets.FIATLUX_LLM_URL }}
          FIATLUX_LLM_CHAVE: ${{ secrets.FIATLUX_LLM_CHAVE }}
          FIATLUX_LLM_MODELO: ${{ vars.FIATLUX_LLM_MODELO }}
          FIATLUX_LLM_MODELO_GERACAO: ${{ vars.FIATLUX_LLM_MODELO_GERACAO }}
          FIATLUX_LLM_MODELO_JUIZ: ${{ vars.FIATLUX_LLM_MODELO_JUIZ }}
          FIATLUX_LLM_SEM_RACIOCINIO: ${{ vars.FIATLUX_LLM_SEM_RACIOCINIO }}
          # entrega por e-mail (o Telegram está provisoriamente desligado no settings.toml)
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_DESTINATARIOS: ${{ secrets.EMAIL_DESTINATARIOS }}
          EMAIL_ADMIN: ${{ secrets.EMAIL_ADMIN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      - if: always()
        run: uv run fiatlux estado commitar --mensagem "semanal ${{ inputs.semana || 'agendada' }}"
